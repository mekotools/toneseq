# Auslieferung: statische Dateien hinter nginx. ToneSeq hat keinen Bauschritt,
# es wird also nichts übersetzt — nur kopiert und geprüft.
#
# - Startseite NICHT zwischenspeichern; Klänge und Programmbibliotheken schon
#   (feste Namen, ändern sich nur mit einer neuen Fassung).
# - Content-Security-Policy verbietet Fremdaufrufe: nur eigene Dateien, Blob-
#   und Daten-Adressen. connect-src 'self' heisst: kein Server ausser unserem.
# - ACHTUNG, nginx-Falle: eine eigene add_header-Zeile in einem location-Block
#   SCHALTET die geerbten add_header-Zeilen ab. Deshalb hier kein add_header in
#   den locations — sonst fällt die CSP genau auf der Startseite weg.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml text/javascript;

    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' blob: data:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /gesundheit {
        return 200 "ok\n";
    }

    location = /index.html {
        expires -1;
    }

    location ~* ^/(audio|vendor)/ {
        expires 30d;
    }

    location ~* \.(mp3|png|svg|jpg|woff2?)$ {
        expires 30d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
